# Build installer mobile (Android APK + Windows EXE) setiap ada perubahan di mobile/.
#
# SETUP SEKALI (di GitHub: Settings > Secrets and variables > Actions > Secrets):
#   API_BASE_URL - contoh: https://api.formup.my.id/api
#
# Secret disuntik lewat DUA jalur (kode mendukung keduanya):
#   1. file mobile/.env (dibundel sebagai asset, dibaca flutter_dotenv)
#   2. --dart-define saat flutter build (fallback bila .env tidak terbaca)
# Tidak ada lagi URL hardcode di workflow ini — bila secret kosong, job
# langsung gagal dengan pesan jelas (fail-fast).
#
# GEMINI_API_KEY sengaja TIDAK lewat sini: key Gemini disimpan per-user di
# aplikasi (secure storage) dan bisa diubah dari menu setting.
name: Build App (Android APK + Windows EXE)

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-app.yml'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Android - APK
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env WAJIB ada: pubspec memakai sebagai asset, build gagal tanpanya.
      - name: Create .env from secrets
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          : "${API_BASE_URL:?Secrets API_BASE_URL belum diisi (Settings > Secrets and variables > Actions).}"
          printf 'API_BASE_URL=%s\n' "$API_BASE_URL" > .env
          grep -q '^API_BASE_URL=.\+' .env && echo '.env OK (API_BASE_URL terisi)'

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: >
          flutter build apk --release
          --dart-define=API_BASE_URL="$API_BASE_URL"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: formup-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows - EXE
  # ---------------------------------------------------------------------------
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env WAJIB ada: pubspec memakai sebagai asset, build gagal tanpanya.
      - name: Create .env from secrets
        working-directory: mobile
        shell: pwsh
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:API_BASE_URL)) { throw 'Secrets API_BASE_URL belum diisi (Settings > Secrets and variables > Actions).' }
          Set-Content -Path .env -Encoding utf8 -Value @(
            "API_BASE_URL=$($env:API_BASE_URL)"
          )
          Write-Host '.env OK (API_BASE_URL terisi)'

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Ambil versi dari pubspec
        working-directory: mobile
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Select-String -Pattern '^version:').Line
          $version = ($line -replace 'version:\s*', '').Split('+')[0].Trim()
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Versi: $version"

      - name: Build Windows
        working-directory: mobile
        shell: pwsh
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: >
          flutter build windows --release
          --dart-define="API_BASE_URL=$($env:API_BASE_URL)"

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe tidak ditemukan' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer (.exe)
        working-directory: mobile
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=$env:APP_VERSION" 'windows\installer\formup.iss'
          $setup = "build\windows\installer\FormUp-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Installer tidak terbentuk' }
          Get-Item $setup | Select-Object FullName, Length

      # Output akhir: SATU file installer .exe (berisi exe + dll + data).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: formup-windows-installer
          path: mobile/build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 14
