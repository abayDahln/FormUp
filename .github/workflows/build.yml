name: Build Mobile (Android APK + Windows EXE)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.47.1'

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Android - APK
  # ---------------------------------------------------------------------------
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env WAJIB ada: pubspec memakai sebagai asset, build gagal tanpanya.
      - name: Create .env
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > .env <<'ENVEOF'
          API_BASE_URL=__API_BASE_URL__
          GEMINI_API_KEY=__GEMINI_API_KEY__
          ENVEOF
          sed -i "s#__API_BASE_URL__#${API_BASE_URL:-http://10.0.2.2:5000/api}#" .env
          sed -i "s#__GEMINI_API_KEY__#${GEMINI_API_KEY:-}#" .env
          echo "--- .env (key disamarkan) ---"
          sed -E 's/(GEMINI_API_KEY=).*/\1***/' .env

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: formup-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows - EXE
  # ---------------------------------------------------------------------------
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env WAJIB ada: pubspec memakai sebagai asset, build gagal tanpanya.
      - name: Create .env
        working-directory: mobile
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $api = $env:API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($api)) { $api = 'http://localhost:5000/api' }
          Set-Content -Path .env -Encoding utf8 -Value @(
            "API_BASE_URL=$api"
            "GEMINI_API_KEY=$($env:GEMINI_API_KEY)"
          )
          Write-Host '--- .env (key disamarkan) ---'
          (Get-Content .env) -replace 'GEMINI_API_KEY=.*', 'GEMINI_API_KEY=***'

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build Windows
        working-directory: mobile
        run: flutter build windows --release

      # Upload seluruh folder Release (bukan hanya form_up.exe) karena exe
      # butuh dll + folder data di sampingnya agar bisa dijalankan.
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: formup-windows-exe
          path: mobile/build/windows/x64/runner/Release/
          if-no-files-found: error
          retention-days: 14
