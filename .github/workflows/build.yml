name: CI + Build Mobile (Android APK + Windows EXE)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Samakan dengan Flutter lokal (cek via `flutter --version` di mobile/).
  FLUTTER_VERSION: '3.47.1'
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '22'

concurrency:
  group: build-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Gate: analisa + test mobile (gagal di sini = artifact tidak dibangun)
  # ---------------------------------------------------------------------------
  mobile-check:
    name: Mobile check (analyze + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze

      - name: Flutter test
        working-directory: mobile
        run: flutter test

  # ---------------------------------------------------------------------------
  # Gate: backend .NET tetap kompilasi
  # ---------------------------------------------------------------------------
  backend-build:
    name: Backend build (dotnet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: dotnet build
        working-directory: api
        run: dotnet build --nologo -v q -p:UseAppHost=false

  # ---------------------------------------------------------------------------
  # Gate: web frontend tetap kompilasi
  # ---------------------------------------------------------------------------
  web-build:
    name: Web build (vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/form-fe/package-lock.json

      - name: npm ci
        working-directory: web/form-fe
        run: npm ci

      - name: npm run lint
        working-directory: web/form-fe
        run: npm run lint

      - name: npm run build
        working-directory: web/form-fe
        run: npm run build

  # ---------------------------------------------------------------------------
  # Android - APK (debug-signed, untuk QA/internal — BUKAN untuk Play Store)
  # ---------------------------------------------------------------------------
  # CATATAN RILIS:
  # - APK ini ditandatangani debug key (lihat android/app/build.gradle.kts).
  #   Untuk Play Store: tambahkan signing config + secrets keystore, dan
  #   ganti applicationId com.example.form_up (masih TODO) sebelum rilis.
  android-apk:
    name: Android APK
    runs-on: ubuntu-latest
    needs: [mobile-check]
    # Hemat menit CI: artifact hanya dibangun di push main / manual,
    # sedangkan PR cukup divalidasi gate di atas.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env WAJIB ada: pubspec memakai sebagai asset, build gagal tanpanya.
      - name: Create .env
        working-directory: mobile
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat > .env <<'ENVEOF'
          API_BASE_URL=__API_BASE_URL__
          GEMINI_API_KEY=__GEMINI_API_KEY__
          ENVEOF
          sed -i "s#__API_BASE_URL__#${API_BASE_URL:-https://api.formup.my.id/api}#" .env
          sed -i "s#__GEMINI_API_KEY__#${GEMINI_API_KEY:-}#" .env
          echo "--- .env (key disamarkan) ---"
          sed -E 's/(GEMINI_API_KEY=).*/\1***/' .env

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Build APK
        working-directory: mobile
        run: |
          flutter build apk --release
          echo '::notice::APK ini debug-signed (QA/internal). Jangan upload ke Play Store.'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: formup-android-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows - EXE
  # ---------------------------------------------------------------------------
  windows-exe:
    name: Windows EXE
    runs-on: windows-latest
    needs: [mobile-check]
    # Hemat menit CI: artifact hanya dibangun di push main / manual,
    # sedangkan PR cukup divalidasi gate di atas.
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # .env WAJIB ada: pubspec memakai sebagai asset, build gagal tanpanya.
      - name: Create .env
        working-directory: mobile
        shell: pwsh
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          $api = $env:API_BASE_URL
          if ([string]::IsNullOrWhiteSpace($api)) { $api = 'https://api.formup.my.id/api' }
          Set-Content -Path .env -Encoding utf8 -Value @(
            "API_BASE_URL=$api"
            "GEMINI_API_KEY=$($env:GEMINI_API_KEY)"
          )
          Write-Host '--- .env (key disamarkan) ---'
          (Get-Content .env) -replace 'GEMINI_API_KEY=.*', 'GEMINI_API_KEY=***'

      - name: Flutter pub get
        working-directory: mobile
        run: flutter pub get

      - name: Ambil versi dari pubspec
        working-directory: mobile
        shell: pwsh
        run: |
          $line = (Get-Content pubspec.yaml | Select-String -Pattern '^version:').Line
          $version = ($line -replace 'version:\s*', '').Split('+')[0].Trim()
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Versi: $version"

      - name: Build Windows
        working-directory: mobile
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw 'ISCC.exe tidak ditemukan' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build installer (.exe)
        working-directory: mobile
        shell: pwsh
        run: |
          & "$env:ISCC" "/DAppVersion=$env:APP_VERSION" 'windows\installer\formup.iss'
          $setup = "build\windows\installer\FormUp-Setup-$env:APP_VERSION.exe"
          if (-not (Test-Path $setup)) { throw 'Installer tidak terbentuk' }
          Get-Item $setup | Select-Object FullName, Length

      # Output akhir: SATU file installer .exe (berisi exe + dll + data).
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: formup-windows-installer
          path: mobile/build/windows/installer/*.exe
          if-no-files-found: error
          retention-days: 14
